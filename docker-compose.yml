services:
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: repairgraph:hardened
    container_name: repairgraph-backend-1
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - INSTANCE_ID=repairgraph-backend-1
      - PORT=3000
    ports:
      - "3001:3000"
    networks:
      - repairgraph-net

  backend-2:
    image: repairgraph:hardened
    container_name: repairgraph-backend-2
    restart: unless-stopped
    depends_on:
      - backend-1
    env_file:
      - .env.docker
    environment:
      - INSTANCE_ID=repairgraph-backend-2
      - PORT=3000
    ports:
      - "3002:3000"
    networks:
      - repairgraph-net

  backend-3:
    image: repairgraph:hardened
    container_name: repairgraph-backend-3
    restart: unless-stopped
    depends_on:
      - backend-1
    env_file:
      - .env.docker
    environment:
      - INSTANCE_ID=repairgraph-backend-3
      - PORT=3000
    ports:
      - "3003:3000"
    networks:
      - repairgraph-net

  nginx:
    image: nginx:alpine
    container_name: repairgraph-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - repairgraph-net

networks:
  repairgraph-net:
    driver: bridge
