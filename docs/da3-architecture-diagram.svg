<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="nginxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="burstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title & Metadata Header -->
  <text x="50" y="45" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">RepairGraph — Cloud Infrastructure &amp; Scaling Architecture</text>
  <text x="50" y="70" fill="#94a3b8" font-size="13">Course: BACSE344 (DA3) • Author: Naidu Reshmanth Sai (25BCE1112) • Multi-Container Cluster &amp; Fog/Cloud Bursting</text>

  <!-- Legend -->
  <g transform="translate(740, 25)">
    <rect x="0" y="0" width="410" height="55" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="7" fill="#3b82f6"/>
    <text x="35" y="24" fill="#cbd5e1" font-size="11">Core Infrastructure (DA1/DA3)</text>
    <circle cx="220" cy="20" r="7" fill="#f59e0b"/>
    <text x="235" y="24" fill="#f59e0b" font-weight="600" font-size="11">Edge/Fog Computing Node</text>
    <circle cx="20" cy="42" r="7" fill="#10b981"/>
    <text x="35" y="46" fill="#cbd5e1" font-size="11">Neon Cloud Database</text>
    <circle cx="220" cy="42" r="7" fill="#8b5cf6"/>
    <text x="235" y="46" fill="#a78bfa" font-weight="600" font-size="11">Cloud Bursting Component</text>
  </g>

  <!-- CLIENT & LOAD TESTING TIER -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="220" height="260" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f8fafc" font-size="14" font-weight="700">Client &amp; Traffic Generator</text>
    <text x="20" y="48" fill="#64748b" font-size="11">Simulated Peak Demand Surge</text>

    <!-- Sub-card 1: Users -->
    <rect x="15" y="65" width="190" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="88" fill="#e2e8f0" font-size="12" font-weight="600">Web &amp; Mobile Clients</text>
    <text x="25" y="106" fill="#94a3b8" font-size="11">Disaster Surge / Flood Damage</text>
    <text x="25" y="122" fill="#38bdf8" font-size="10">Next.js 15 App (React 19)</text>

    <!-- Sub-card 2: Apache Bench -->
    <rect x="15" y="155" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="25" y="178" fill="#e2e8f0" font-size="12" font-weight="600">Apache Bench (ab v2.3)</text>
    <text x="25" y="196" fill="#94a3b8" font-size="11">1,000 Requests • Concurrency 20</text>
    <text x="25" y="212" fill="#34d399" font-size="10">Tested: /api/diagnostics/triage</text>
    <text x="25" y="226" fill="#fbbf24" font-size="10">Benchmark: 83.82 RPS (+106.2%)</text>
  </g>

  <!-- NGINX LOAD BALANCER TIER -->
  <g transform="translate(330, 110)">
    <rect x="0" y="0" width="250" height="260" rx="12" fill="#064e3b" stroke="#059669" stroke-width="2" filter="url(#glow)"/>
    <rect x="0" y="0" width="250" height="260" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="32" fill="#34d399" font-size="15" font-weight="700">Nginx Load Balancer</text>
    <text x="20" y="50" fill="#a7f3d0" font-size="11">Reverse Proxy • Container: repairgraph-nginx</text>

    <rect x="15" y="65" width="220" height="180" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="25" y="88" fill="#f8fafc" font-size="12" font-weight="600">Host Port: 8080 ➔ Container: 80</text>
    <text x="25" y="108" fill="#93c5fd" font-size="11">• Round-Robin Scheduling</text>
    <text x="25" y="126" fill="#93c5fd" font-size="11">• Header: X-Upstream-Server</text>
    <text x="25" y="144" fill="#93c5fd" font-size="11">• Header: X-Backend-Instance</text>

    <rect x="25" y="160" width="200" height="70" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="32" y="178" fill="#a7f3d0" font-size="11" font-weight="700">Zero-Downtime Tuning (Q1.c):</text>
    <text x="32" y="196" fill="#ecfdf5" font-size="10">proxy_next_upstream error timeout;</text>
    <text x="32" y="210" fill="#ecfdf5" font-size="10">proxy_next_upstream_tries 3;</text>
    <text x="32" y="224" fill="#6ee7b7" font-size="10">Failover Result: 0 Failed Requests</text>
  </g>

  <!-- THREE BACKEND REPLICAS TIER -->
  <g transform="translate(650, 90)">
    <rect x="0" y="0" width="280" height="340" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="28" fill="#60a5fa" font-size="15" font-weight="700">Backend Cluster (Docker Compose)</text>
    <text x="20" y="44" fill="#94a3b8" font-size="11">Image: repairgraph:hardened (Alpine 3.20, Standalone)</text>

    <!-- Backend 1 -->
    <rect x="15" y="58" width="250" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="25" y="78" fill="#f8fafc" font-size="12" font-weight="600">repairgraph-backend-1</text>
    <text x="25" y="96" fill="#94a3b8" font-size="11">Port Mapping: <tspan fill="#38bdf8" font-weight="600">3001:3000</tspan> • User: nextjs (1001)</text>
    <text x="25" y="112" fill="#cbd5e1" font-size="10">Two-Tier Diagnostic Scoring &amp; Decision Engine</text>
    <text x="25" y="126" fill="#34d399" font-size="10">Status: HEALTHY (Latency: ~210ms)</text>

    <!-- Backend 2 -->
    <rect x="15" y="148" width="250" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="25" y="168" fill="#f8fafc" font-size="12" font-weight="600">repairgraph-backend-2</text>
    <text x="25" y="186" fill="#94a3b8" font-size="11">Port Mapping: <tspan fill="#38bdf8" font-weight="600">3002:3000</tspan> • User: nextjs (1001)</text>
    <text x="25" y="202" fill="#cbd5e1" font-size="10">Target for Mid-Flight Chaos Termination</text>
    <text x="25" y="216" fill="#f87171" font-size="10">Killed in Q1.c ➔ Auto-recovered by Nginx</text>

    <!-- Backend 3 -->
    <rect x="15" y="238" width="250" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="25" y="258" fill="#f8fafc" font-size="12" font-weight="600">repairgraph-backend-3</text>
    <text x="25" y="276" fill="#94a3b8" font-size="11">Port Mapping: <tspan fill="#38bdf8" font-weight="600">3003:3000</tspan> • User: nextjs (1001)</text>
    <text x="25" y="292" fill="#cbd5e1" font-size="10">Two-Tier Diagnostic Scoring &amp; Decision Engine</text>
    <text x="25" y="306" fill="#34d399" font-size="10">Status: HEALTHY (Latency: ~268ms)</text>
  </g>

  <!-- CLOUD DATABASE TIER (NEON) -->
  <g transform="translate(980, 110)">
    <rect x="0" y="0" width="180" height="300" rx="12" fill="#022c22" stroke="#10b981" stroke-width="1.8" filter="url(#glow)"/>
    <rect x="0" y="0" width="180" height="300" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="32" fill="#34d399" font-size="14" font-weight="700">Neon Cloud Database</text>
    <text x="16" y="50" fill="#6ee7b7" font-size="11">Assignment 1 Cloud DB</text>

    <rect x="12" y="65" width="156" height="220" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="20" y="88" fill="#f8fafc" font-size="11" font-weight="600">Serverless PostgreSQL 16</text>
    <text x="20" y="106" fill="#94a3b8" font-size="10">AWS Region: ap-southeast-1</text>
    <text x="20" y="122" fill="#94a3b8" font-size="10">(Singapore)</text>
    
    <text x="20" y="146" fill="#38bdf8" font-size="11" font-weight="600">Connection Mode:</text>
    <text x="20" y="162" fill="#cbd5e1" font-size="10">PgBouncer Connection Pooler</text>
    <text x="20" y="178" fill="#cbd5e1" font-size="10">TLS 1.3 / sslmode=require</text>

    <text x="20" y="202" fill="#f59e0b" font-size="11" font-weight="600">Security (Q2.a):</text>
    <text x="20" y="218" fill="#fef3c7" font-size="10">• Salted Bcrypt Hashes</text>
    <text x="20" y="232" fill="#fef3c7" font-size="10">  ($2b$10$... 10 rounds)</text>
    <text x="20" y="248" fill="#fef3c7" font-size="10">• 11 Relational Entities</text>
    <text x="20" y="264" fill="#34d399" font-size="10">• Zero Plaintext Storage</text>
  </g>

  <!-- ASSIGNMENT 1 HOSTING PLATFORM (VERCEL) -->
  <g transform="translate(50, 460)">
    <rect x="0" y="0" width="270" height="150" rx="12" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f4f4f5" font-size="14" font-weight="700">Assignment 1 Hosting Platform</text>
    <text x="20" y="48" fill="#a1a1aa" font-size="11">Production Deployment (Vercel Edge)</text>

    <rect x="15" y="60" width="240" height="75" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
    <text x="25" y="82" fill="#fafafa" font-size="12" font-weight="600">Live URL: repairgraph.vercel.app</text>
    <text x="25" y="100" fill="#a1a1aa" font-size="11">• Anycast Global Edge Network</text>
    <text x="25" y="118" fill="#a1a1aa" font-size="11">• Auto-deployed from GitHub (assignment-3)</text>
  </g>

  <!-- CLOUD BURSTING COMPONENT (QUESTION 1.d - HIGHLIGHTED IN DISTINCT VIOLET) -->
  <g transform="translate(360, 460)">
    <rect x="0" y="0" width="370" height="310" rx="12" fill="#2e1065" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="0" y="0" width="370" height="310" rx="12" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="20" y="16" width="220" height="24" rx="12" fill="#8b5cf6"/>
    <text x="28" y="32" fill="#ffffff" font-size="11" font-weight="700">Q1.d CLOUD BURSTING EXTENSION</text>

    <text x="20" y="65" fill="#f5f3ff" font-size="14" font-weight="700">Hybrid Cloud Bursting Orchestrator</text>
    <text x="20" y="83" fill="#c4b5fd" font-size="11">Elastic Surge Spillover: Docker Cluster ➔ Vercel/Cloud Run</text>

    <rect x="15" y="95" width="340" height="195" rx="8" fill="#2e1065" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="25" y="120" fill="#ede9fe" font-size="12" font-weight="600">Surge Threshold Monitoring:</text>
    <text x="25" y="140" fill="#ddd6fe" font-size="11">• Trigger: Nginx Queue &gt; 80% or RPS &gt; 120 req/sec</text>
    <text x="25" y="158" fill="#ddd6fe" font-size="11">• Target: Ephemeral Vercel Serverless Function Instances</text>
    
    <text x="25" y="185" fill="#a78bfa" font-size="12" font-weight="600">Domain Justification (Why Chose for RepairGraph):</text>
    <text x="25" y="205" fill="#f5f3ff" font-size="10.5">Post-monsoon flood damage causes acute, irregular 10x traffic</text>
    <text x="25" y="221" fill="#f5f3ff" font-size="10.5">spikes that last only 3–5 days. Cloud bursting avoids 24/7 fixed</text>
    <text x="25" y="237" fill="#f5f3ff" font-size="10.5">infrastructure costs while preserving zero downtime during disasters.</text>
    <text x="25" y="260" fill="#34d399" font-size="11" font-weight="600">✓ Seamless failover with shared Neon DB connection pooling</text>
  </g>

  <!-- EDGE / FOG COMPUTING COMPONENT (QUESTION 1.d - HIGHLIGHTED IN DISTINCT AMBER) -->
  <g transform="translate(770, 460)">
    <rect x="0" y="0" width="390" height="310" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="0" y="0" width="390" height="310" rx="12" fill="#291202" stroke="#fbbf24" stroke-width="1.8"/>

    <!-- Badge -->
    <rect x="20" y="16" width="220" height="24" rx="12" fill="#f59e0b"/>
    <text x="28" y="32" fill="#000000" font-size="11" font-weight="700">Q1.d EDGE/FOG COMPUTING NODE</text>

    <text x="20" y="65" fill="#fef3c7" font-size="14" font-weight="700">Service Center Rapid Triage Kiosk (Fog)</text>
    <text x="20" y="83" fill="#fde68a" font-size="11">Local Pre-Processing &amp; Offline E-Waste Intake Nodes</text>

    <rect x="15" y="95" width="360" height="195" rx="8" fill="#3b1704" stroke="#d97706" stroke-width="1.2"/>
    <text x="25" y="120" fill="#fef3c7" font-size="12" font-weight="600">On-Premise Fog Capabilities:</text>
    <text x="25" y="140" fill="#fef9c3" font-size="11">• Edge Heuristic Parser: Offline symptom &amp; hazard classification</text>
    <text x="25" y="158" fill="#fef9c3" font-size="11">• Local SQLite / Redis Cache: Parts price index &amp; manuals</text>
    <text x="25" y="176" fill="#fef9c3" font-size="11">• Immediate On-Site QR Repair Passport Issuance</text>
    
    <text x="25" y="202" fill="#fbbf24" font-size="12" font-weight="600">Domain Justification (Why Chose for RepairGraph):</text>
    <text x="25" y="222" fill="#fef3c7" font-size="10.5">During floods/power outages, technicians at physical kiosks</text>
    <text x="25" y="238" fill="#fef3c7" font-size="10.5">can triage water-damaged phones/laptops offline with 0ms latency,</text>
    <text x="25" y="254" fill="#fef3c7" font-size="10.5">batch-syncing records to Neon PostgreSQL when connectivity returns.</text>
    <text x="25" y="274" fill="#34d399" font-size="11" font-weight="600">✓ Offloads 60% of diagnostic compute from main cloud</text>
  </g>

  <!-- CONNECTING ARROWS & DATA FLOWS -->
  <!-- Traffic Generator -> Nginx -->
  <line x1="270" y1="240" x2="325" y2="240" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="272" y="230" fill="#94a3b8" font-size="10">Port 8080</text>

  <!-- Nginx -> Backends -->
  <path d="M 580 200 L 615 200 L 615 100 L 645 100" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 240 L 645 240" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 280 L 615 280 L 615 380 L 645 380" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="180" fill="#38bdf8" font-size="10">Round Robin</text>

  <!-- Backends -> Neon Cloud DB -->
  <line x1="930" y1="260" x2="975" y2="260" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
  <text x="932" y="250" fill="#34d399" font-size="10">PgBouncer</text>

  <!-- Nginx -> Cloud Bursting -->
  <path d="M 455 370 L 455 455" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow-violet)"/>
  <text x="462" y="415" fill="#c4b5fd" font-size="10" font-weight="600">Burst Spillover</text>

  <!-- Fog Node -> Neon Sync -->
  <path d="M 965 460 L 965 425 L 1030 425 L 1030 415" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-amber)"/>
  <text x="970" y="440" fill="#fbbf24" font-size="10">Batch Sync</text>

</svg>
