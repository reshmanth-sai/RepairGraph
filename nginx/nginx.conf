events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    log_format upstreamlog '[$time_local] client=$remote_addr request="$request" '
                           'status=$status upstream_addr=$upstream_addr '
                           'upstream_status=$upstream_status response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log upstreamlog;
    error_log  /var/log/nginx/error.log warn;

    # Upstream backend pool: 3 instances running on internal port 3000
    upstream repairgraph_backend {
        server backend-1:3000 max_fails=2 fail_timeout=5s;
        server backend-2:3000 max_fails=2 fail_timeout=5s;
        server backend-3:3000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://repairgraph_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Load-Balancer "RepairGraph-Nginx-Cluster" always;

            # High-Availability Failover Configuration (Question 1.c)
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
    }
}
