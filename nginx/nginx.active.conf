events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    log_format upstreamlog '[$time_local] client=$remote_addr request="$request" '
                           'status=$status upstream_addr=$upstream_addr '
                           'upstream_status=$upstream_status response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log upstreamlog;
    error_log  /var/log/nginx/error.log warn;

    # Upstream backend pool: 3 instances running on internal port 3000
    upstream repairgraph_backend {
        server backend-1:3000;
        server backend-2:3000;
        server backend-3:3000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://repairgraph_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Load-Balancer "RepairGraph-Nginx-Cluster" always;

            # Baseline: No automatic retry/failover configured (default Nginx behavior)
            proxy_next_upstream off;
        }
    }
}
